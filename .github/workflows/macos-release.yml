name: macOS draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag on main (vX.Y.Z; existing releases are refused)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 45
    environment: macos-release
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '2'
      RELEASE_TAG: ${{ inputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out main with tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate existing tag and refuse release replacement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$RELEASE_TAG" == v0.2.3 ]]; then
            echo 'The qualified 0.2.3 release is immutable; select a new version.' >&2
            exit 1
          fi
          release_sha="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$release_sha" origin/main
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" > "$RUNNER_TEMP/releases.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          pages = json.loads((Path(os.environ['RUNNER_TEMP']) / 'releases.json').read_text())
          if any(r['tag_name'] == os.environ['RELEASE_TAG'] for page in pages for r in page):
              raise SystemExit('A draft or published release already exists for this tag; refusing replacement.')
          PY
          git checkout --detach "$release_sha"
          python3 - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as f:
              version = tomllib.load(f)['package']['version']
          if os.environ['RELEASE_TAG'] != 'v' + version:
              raise SystemExit('Tag does not match the Cargo package version.')
          PY
          test -z "$(git status --porcelain)"
      - name: Install toolchain and fetch locked dependencies
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy
          rustup default 1.99.0
          rustup target add aarch64-apple-darwin
          test "$(rustc -vV | sed -n 's/^host: //p')" = aarch64-apple-darwin
          # Packaging reads license manifests for every dependency in Cargo metadata.
          cargo fetch --locked
          python3 -m pip install reportlab==4.4.9
      - name: Qualify exact tagged source
        run: |
          # Footprint and symbol checks inspect the real release executable.
          cargo build --locked --offline --release
          cargo test --locked --offline --all-targets --no-fail-fast -- --test-threads=1
          cargo test --locked --offline --lib campaign::tests:: -- --include-ignored --nocapture --test-threads=1
          cargo test --locked --offline --test corporate_precision -- --ignored --nocapture --test-threads=1
          cargo test --locked --offline --doc
          cargo clippy --locked --offline --all-targets -- -D warnings
      - name: Generate player manual
        run: python3 scripts/build-manual.py
      - name: Install temporary signing and notarization credentials
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
        run: |
          : "${MACOS_CERTIFICATE_P12_BASE64:?Missing environment secret}"
          : "${MACOS_CERTIFICATE_PASSWORD:?Missing environment secret}"
          : "${APPLE_API_PRIVATE_KEY_BASE64:?Missing environment secret}"
          : "${MACOS_SIGNING_IDENTITY:?Missing environment variable}"
          : "${APPLE_API_KEY_ID:?Missing environment variable}"
          : "${APPLE_API_ISSUER_ID:?Missing environment variable}"
          umask 077
          certificate="$RUNNER_TEMP/voxel-demolition-certificate.p12"
          api_key="$RUNNER_TEMP/voxel-demolition-notary.p8"
          keychain="$RUNNER_TEMP/voxel-demolition-signing.keychain-db"
          trap 'rm -f "$certificate" "$api_key"' EXIT
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 --decode > "$api_key"
          keychain_password="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$MACOS_CERTIFICATE_PASSWORD" -t cert -f pkcs12 -k "$keychain" -T /usr/bin/codesign > /dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          xcrun notarytool store-credentials voxel-demolition-ci --key "$api_key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --keychain "$keychain" > /dev/null
      - name: Sign, notarize and staple exact candidate
        env:
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_PROFILE: voxel-demolition-ci
          MACOS_NOTARY_KEYCHAIN: ${{ runner.temp }}/voxel-demolition-signing.keychain-db
        run: ./scripts/package-release.sh --notarize
      - name: Create draft with exact candidate assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          archive="dist/voxel-demolition-$version-aarch64-apple-darwin-notarized.zip"
          checksum="dist/voxel-demolition-$version-aarch64-apple-darwin-notarized-SHA256SUMS.txt"
          (cd dist && shasum -a 256 -c "${checksum#dist/}")
          remote_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          test "$remote_sha" = "$(git rev-parse HEAD)"
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          (Path(os.environ['RUNNER_TEMP']) / 'release-notes.md').write_text(
              f"Apple Silicon macOS candidate from `{revision}`.\n\n"
              "Automated qualification, Developer ID signing, notarization and stapling completed. "
              "Before publishing, download the assets, verify hashes and perform native gameplay "
              "and manual review on the exact extracted app. See docs/release.md.\n"
          )
          PY
          gh release create "$RELEASE_TAG" "$archive" "$checksum" output/pdf/Voxel-Demolition-Player-Manual.pdf --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Voxel Demolition $version" --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Retain failed notarization diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: macos-notarization-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            dist/validation/**/NOTARIZATION_SUBMISSION.json
            dist/validation/**/NOTARIZATION_LOG.json
            dist/validation/**/NOTARIZATION_STDERR.txt
            dist/validation/**/NOTARIZATION_EXIT_CODE.txt
            dist/validation/**/GATEKEEPER.txt
      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/voxel-demolition-certificate.p12" "$RUNNER_TEMP/voxel-demolition-notary.p8"
          keychain="$RUNNER_TEMP/voxel-demolition-signing.keychain-db"
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain"
          fi
