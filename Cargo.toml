[package]
name = "voxel_demolition"
version = "0.2.5"
edition = "2021"
description = "A native first-person voxel demolition sandbox with procedural structures, physics, and synthesized audio."
license = "MIT OR Apache-2.0"
keywords = ["voxel", "destruction", "physics", "simulation", "macroquad"]
categories = ["games", "simulation", "rendering"]
readme = "README.md"
repository = "https://github.com/steph4n-gh/voxel-demolition"
exclude = ["target*", "dist", ".DS_Store", "out.log", "test_output.txt", "output", "tmp/pdfs"]

[dependencies]
macroquad = { version = "=0.4.16", features = ["audio"] }

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 3
codegen-units = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
